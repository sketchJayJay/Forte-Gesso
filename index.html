<div id="login" class="login"><form id="loginform" class="loginbox"><img src="/logo.jpg" alt="Forte Gesso"><h1>FORTE GESSO</h1><p>Gestão de obras e finanças</p><input name="username" class="field" placeholder="Usuário" autocomplete="username" required><input name="password" type="password" class="field" placeholder="Senha" autocomplete="current-password" required><button class="btn primary" type="submit">Entrar no sistema ↗</button><p id="loginerr" style="color:var(--red)"></p></form></div>

<script>
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), fmt=d=>d?d.slice(0,10).split('-').reverse().join('/'):'—', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), dt=()=>new Date().toLocaleDateString('en-CA'), mon=()=>new Date().toLocaleDateString('en-CA').slice(0,7);
let page='dashboard',data={clients:[],jobs:[],quotes:[],movements:[]},summary={},filter='',statusFilter='',month=mon();

async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({error:'Resposta inválida'}));if(!r.ok)throw Error(d.error||'Erro '+r.status);return d}
function toast(s){$('#toastroot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toastroot').innerHTML='',3500)}
async function startup(){let u=await api('/api/me');$('#login').classList.toggle('hide',u.authenticated);$('#shell').classList.toggle('hide',!u.authenticated);if(u.authenticated){$('#today').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});await load()}}
$('#loginform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});$('#loginerr').textContent='';await startup()}catch(err){$('#loginerr').textContent=err.message}};

async function load(){try{let [clients,jobs,quotes,movements,s]=await Promise.all(['clients','jobs','quotes','movements'].map(t=>api('/api/'+t)).concat(api('/api/summary?month='+month)));Object.assign(data,{clients,jobs,quotes,movements});summary=s;render()}catch(e){toast(e.message)}}

function person(id){return data.clients.find(x=>x.id==id)?.name||'Sem cliente'}function jobname(id){return data.jobs.find(x=>x.id==id)?.title||'Sem obra'}
function card(label,n,sub,cls=''){return `<div class="card"><label>${label}<span class="circle">◈</span></label><strong class="${cls}">${n}</strong><small>${sub}</small></div>`}
function dashboard(){let recent=[...data.movements].slice(0,6);let upcoming=[...data.jobs].filter(x=>x.status!=='cancelado'&&x.job_date>=dt()).sort((a,b)=>a.job_date.localeCompare(b.job_date)).slice(0,6);return `<div class="mobile-hero"><span class="eyebrow">Seu negócio em suas mãos</span><h2 style="margin:8px 0;font-size:25px">Controle total, do orçamento à entrega.</h2><p class="muted" style="margin:0">Obras, recebimentos, cheques, materiais e despesas organizados sem misturar os números.</p></div><div class="quick-grid"><button onclick="openForm('clients')"><span class="quick-icon">♙</span>Novo cliente</button><button onclick="openForm('jobs')"><span class="quick-icon">▤</span>Nova obra</button><button onclick="openForm('movements')"><span class="quick-icon">＋</span>Lançamento</button></div><div class="cards">${card('Recebido no mês' ,money(summary.received),'Entradas confirmadas','positive')}${card('Saídas no mês',money(summary.spent),'Materiais + despesas + ajudantes','negative')}${card('Saldo de caixa',money(summary.profit),'Entradas menos saídas')}${card('A receber',money(summary.to_receive),'Todos os lançamentos pendentes')}</div><div class="grid2"><section class="box"><div class="box-header"><h3>Próximas obras</h3><button class="btn small" onclick="navigate('calendar')">Ver agenda →</button></div>${upcoming.length?upcoming.map(j=>`<div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px"><div><b>${esc(j.title)}</b><div class="muted">${esc(person(j.client_id))} • ${fmt(j.job_date)}</div></div><span class="tag ${j.status}">${esc(j.status)}</span></div>`).join(''):'<p class="empty">Nenhuma obra agendada.</p>'}</section><section class="box"><div class="box-header"><h3>Últimos lançamentos</h3><button class="btn small" onclick="navigate('finance')">Financeiro →</button></div>${recent.length?recent.map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(m.description)}</b><div class="muted">${kindName(m.kind)} • ${fmt(m.paid_date||m.due_date)}</div></div><b class="${m.kind==='receita'?'positive':'negative'}">${money(m.amount)}</b></div>`).join(''):'<p class="empty">Sem lançamentos.</p>'}</section></div>`}
function kindName(k){return {receita:'Receita',material:'Material',despesa:'Despesa geral',ajudante:'Ajudante'}[k]||k}
const columns={clients:[['name','Nome'],['phone','Telefone'],['address','Endereço']],jobs:[['title','Obra / serviço'],['client_id','Cliente'],['job_date','Data'],['status','Status'],['price','Valor acordado']],quotes:[['title','Orçamento'],['client_id','Cliente'],['total','Valor'],['status','Situação']],movements:[['description','Descrição'],['kind','Categoria'],['job_id','Obra'],['amount','Valor'],['due_date','Vencimento'],['method','Pagamento'],['status','Status']]};
function cell(k,v){if(k==='client_id')return esc(person(v));if(k==='job_id')return esc(jobname(v));if(['amount','total','price','helper_cost'].includes(k))return money(v);if(['due_date','paid_date','job_date'].includes(k))return fmt(v);if(k==='kind')return kindName(v);if(k==='status')return `<span class="tag ${esc(v)}">${esc(v)}</span>`;return esc(v)}
function table(t,records,cols=columns[t],actions=true){return `<div class="tablewrap"><table><thead><tr>${cols.map(x=>`<th>${x[1]}</th>`).join('')}${actions?'<th>Ações</th>':''}</tr></thead><tbody>${records.length?records.map(r=>`<tr>${cols.map(([k])=>`<td data-label="${esc(cols.find(x=>x[0]===k)?.[1]||k)}">${cell(k,r[k])}</td>`).join('')}${actions?`<td data-label="Ações"><div class="actions"><button class="btn small" onclick="edit('${t}',${r.id})">Editar</button>${t==='quotes'?`<button class="btn small" onclick="printQuote(${r.id})">Imprimir</button>`:''}<button class="btn small danger" onclick="removeItem('${t}',${r.id})">Excluir</button></div></td>`:''}</tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`}
function searchUpdate(el){let pos=el.selectionStart;filter=el.value;render();let next=document.querySelector('.filters input[placeholder]');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch(e){}}}
function findRecords(records){return records.filter(r=>JSON.stringify(r).toLowerCase().includes(filter.toLowerCase())&&(!statusFilter||r.status===statusFilter))}
function listHeader(t,title,subtitle){return `<div class="box-header"><div><h3>${title}</h3><div class="muted">${subtitle}</div></div><button class="btn primary" onclick="openForm('${t}')">+ Adicionar</button></div>`}
function listing(t){let title={clients:'Cadastro de clientes',jobs:'Obras e serviços',quotes:'Orçamentos'}[t];return `<section class="box">${listHeader(t,title,`${data[t].length} registros cadastrados`)}<div class="filters"><input class="field" placeholder="🔎 Buscar..." value="${esc(filter)}" oninput="searchUpdate(this)">${t!=='clients'?`<select class="field" onchange="statusFilter=this.value;render()"><option value="">Todos os status</option>${(t==='jobs'?['agendado','andamento','concluido','cancelado']:['pendente','aprovado','recusado']).map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select>`:''}<button class="btn" onclick="downloadCsv('${t}')">↓ CSV</button></div>${table(t,findRecords(data[t]))}</section>`}
function calendar(){let jobs=[...data.jobs].filter(x=>x.job_date).sort((a,b)=>a.job_date.localeCompare(b.job_date));return `<section class="box">${listHeader('jobs','Agenda de obras','Todos os dias programados, sem necessidade de horário')}<div class="filters"><input class="field" type="month" value="${month}" onchange="month=this.value;load()"></div>${table('jobs',jobs.filter(x=>x.job_date.startsWith(month)))}</section>`}
function relevant(p){return data.movements.filter(m=>p==='cheques'?m.method==='cheque':p==='materials'?m.kind==='material':p==='expenses'?m.kind==='despesa':true)}
function financeList(p){let arr=relevant(p);return `<section class="box">${listHeader('movements',p==='cheques'?'Controle de cheques':p==='materials'?'Compras de materiais':'Despesas gerais',p==='cheques'?'Cheques recebidos e emitidos, com vencimento e baixa':p==='materials'?'Materiais separados das despesas operacionais':'Custos gerais, separados das compras de material')}<div class="filters"><input class="field" placeholder="🔎 Buscar lançamento" value="${esc(filter)}" oninput="searchUpdate(this)"><select class="field" onchange="statusFilter=this.value;render()"><option value="">Todos</option>${['pendente','pago','cancelado'].map(x=>`<option ${statusFilter===x?'selected':''}>${x}</option>`).join('')}</select></div>${table('movements',findRecords(arr),p==='cheques'?[['description','Descrição'],['cheque_number','Nº cheque'],['cheque_bank','Banco'],['cheque_holder','Titular'],['kind','Tipo'],['amount','Valor'],['due_date','Compensação'],['status','Status']]:columns.movements)}</section>`}
function finance(){let s=summary;return `<div class="filters"><input class="field" type="month" value="${month}" onchange="month=this.value;load()"><button class="btn" onclick="downloadCsv('movements')">↓ Exportar CSV</button></div><div class="cards">${card('Entradas recebidas',money(s.received),'No mês selecionado','positive')}${card('Pagamentos realizados',money(s.spent),'No mês selecionado','negative')}${card('A receber',money(s.to_receive),'Total pendente')}${card('A pagar',money(s.to_pay),'Total pendente')}</div><section class="box">${listHeader('movements','Entradas e saídas','Lançamentos com baixa individual, categoria e forma de pagamento')}<div class="filters"><input class="field" placeholder="🔎 Buscar" value="${esc(filter)}" oninput="searchUpdate(this)"><select class="field" onchange="statusFilter=this.value;render()"><option value="">Todos os status</option>${['pendente','pago','cancelado'].map(x=>`<option ${statusFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="filter='';statusFilter='pendente';render()">Pendências</button></div>${table('movements',findRecords(data.movements))}</section>`}
function reports(){let s=summary;let cats=[['receita','Receitas'],['material','Materiais'],['despesa','Despesas gerais'],['ajudante','Ajudantes']];let max=Math.max(1,...cats.map(x=>s.totals?.[x[0]]||0));return `<div class="filters"><input class="field" type="month" value="${month}" onchange="month=this.value;load()"><button class="btn" onclick="window.print()">Imprimir relatório</button></div><div class="cards">${card('Recebido',money(s.received),'Confirmado no período')}${card('Pago',money(s.spent),'Confirmado no período')}${card('Saldo realizado',money(s.profit),'Não inclui valores pendentes')}${card('Obras em aberto',s.active_jobs||0,'Agendadas e em andamento')}</div><div class="grid2"><section class="box"><h3>Movimentação por categoria (realizada)</h3>${cats.map(([k,n])=>`<div class="barrow"><span>${n}</span><div class="bartrack"><div class="barfill" style="width:${(s.totals?.[k]||0)/max*100}%"></div></div><b>${money(s.totals?.[k]||0)}</b></div>`).join('')}</section><section class="box"><h3>Conceitos do financeiro</h3><p class="muted">O saldo mostra apenas valores com status <b>pago/recebido</b> e usa a data de baixa. Pendências ficam fora do saldo realizado. Materiais, despesas gerais e ajudantes são categorias separadas. Cheque é uma <b>forma de pagamento</b>, portanto não é uma segunda despesa.</p><button class="btn" onclick="navigate('cheques')">Consultar cheques →</button></section></div>`}
function openNew(){openForm(page==='clients'?'clients':page==='quotes'?'quotes':page==='jobs'||page==='calendar'?'jobs':'movements',null)}
function selectOptions(items,current,placeholder='Selecione'){return `<option value="">${placeholder}</option>`+items.map(([id,n])=>`<option value="${esc(id)}" ${String(current??'')===String(id)?'selected':''}>${esc(n)}</option>`).join('')}
function field(k,label,type='text',v='',opts=''){if(type==='textarea')return `<label class="fgroup wide"><span>${label}</span><textarea class="field" name="${k}">${esc(v)}</textarea></label>`;if(type==='select')return `<label class="fgroup"><span>${label}</span><select class="field" name="${k}">${opts}</select></label>`;return `<label class="fgroup"><span>${label}</span><input class="field" name="${k}" type="${type}" ${type==='number'?'step="0.01" min="0"':''} value="${esc(v)}"></label>`}
function option(vals,v){return vals.map(x=>`<option ${x===v?'selected':''} value="${x}">${x}</option>`).join('')}
function formFields(t,r){let clientopt=selectOptions(data.clients.map(x=>[x.id,x.name]),r.client_id,'Sem cliente vinculado'),jobopt=selectOptions(data.jobs.map(x=>[x.id,x.title]),r.job_id,'Sem obra vinculada');if(t==='clients')return field('name','Nome completo *','text',r.name)+field('phone','Telefone / WhatsApp','tel',r.phone)+field('address','Endereço','text',r.address)+field('notes','Observações','textarea',r.notes);if(t==='jobs')return field('client_id','Cliente','select','',clientopt)+field('title','Título da obra / serviço *','text',r.title)+field('job_date','Dia do serviço','date',r.job_date)+field('status','Situação','select','',option(['agendado','andamento','concluido','cancelado'],r.status||'agendado'))+field('price','Valor contratado (R$)','number',r.price||0)+field('helper','Nome do ajudante','text',r.helper)+field('helper_cost','Valor combinado com ajudante (informativo)','number',r.helper_cost||0)+field('description','Descrição do serviço','textarea',r.description)+field('notes','Observações','textarea',r.notes);if(t==='quotes')return field('client_id','Cliente','select','',clientopt)+field('title','Título do orçamento *','text',r.title)+field('status','Situação','select','',option(['pendente','aprovado','recusado'],r.status||'pendente'))+`<div class="fgroup wide"><span>Itens (descrição • quantidade • preço unitário)</span><div id="quoteitems"></div><button type="button" class="btn small" onclick="addQuoteItem()">+ Adicionar item</button></div><div class="fgroup wide"><span>Total do orçamento: <b id="qtotal">R$ 0,00</b></span></div>`;return field('kind','Categoria *','select','',selectOptions([['receita','Receita / valor a receber'],['material','Compra de material'],['despesa','Despesa geral'],['ajudante','Pagamento de ajudante']],r.kind|| (page==='materials'?'material':page==='expenses'?'despesa':''),'Selecione a categoria'))+field('description','Descrição *','text',r.description)+field('amount','Valor (R$)','number',r.amount||'')+field('method','Forma de pagamento','select','',option(['pix','dinheiro','transferencia','cartao','cheque','outro'],r.method||(page==='cheques'?'cheque':'pix')))+field('due_date','Vencimento / data prevista','date',r.due_date||dt())+field('status','Situação','select','',option(['pendente','pago','cancelado'],r.status||'pendente'))+field('paid_date','Data de pagamento / recebimento','date',r.paid_date||'')+field('client_id','Cliente','select','',clientopt)+field('job_id','Obra','select','',jobopt)+`<div class="fgroup wide" id="chequefields"><span>Dados do cheque (se usar cheque)</span><div class="fields">${field('cheque_number','Número do cheque','text',r.cheque_number)}${field('cheque_bank','Banco','text',r.cheque_bank)}${field('cheque_holder','Titular / emitente','text',r.cheque_holder)}</div></div>`+field('notes','Observações','textarea',r.notes)}
function openForm(t,id=null){let r=id?data[t].find(x=>x.id===id):{};r=r||{};$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${id?'Editar':'Novo'} ${({clients:'cliente',jobs:'serviço',quotes:'orçamento',movements:'lançamento'})[t]}</h2><form id="recordform"><div class="fields">${formFields(t,r)}</div><div class="modalfoot"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar registro</button></div></form></div></div>`;if(t==='quotes'){(r.items?.length?r.items:[{description:'',qty:1,price:0}]).forEach(i=>addQuoteItem(i))}if(t==='movements'){toggleCheque();$('#recordform [name=method]').onchange=toggleCheque}$('#recordform').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(t==='quotes'){d.items=[...document.querySelectorAll('.quoteitem')].map(row=>({description:row.querySelector('[data-desc]').value,qty:Number(row.querySelector('[data-qty]').value)||0,price:Number(row.querySelector('[data-price]').value)||0}));d.total=Math.round(d.items.reduce((s,i)=>s+i.qty*i.price,0)*100)/100}try{await api('/api/'+t+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(d)});closeModal();toast('Registro salvo com sucesso');await load()}catch(err){toast(err.message)}}}
function toggleCheque(){let el=$('#recordform [name=method]');if(el)$('#chequefields').classList.toggle('hide',el.value!=='cheque')}
function addQuoteItem(i={}){let wrap=$('#quoteitems');wrap.insertAdjacentHTML('beforeend',`<div class="quoteitem"><input class="field" data-desc placeholder="Serviço / item" value="${esc(i.description||'')}"><input class="field" data-qty type="number" min="0" step="0.01" value="${esc(i.qty??1)}"><input class="field" data-price type="number" min="0" step="0.01" value="${esc(i.price??0)}"><button class="btn small danger" type="button" onclick="this.parentElement.remove();totalQuote()">✕</button></div>`);wrap.oninput=totalQuote;totalQuote()}
function totalQuote(){let n=[...document.querySelectorAll('.quoteitem')].reduce((s,r)=>s+(Number(r.querySelector('[data-qty]').value)||0)*(Number(r.querySelector('[data-price]').value)||0),0);$('#qtotal').textContent=money(n)}
function closeModal(){$('#modalroot').innerHTML=''}function edit(t,id){openForm(t,id)}
async function removeItem(t,id){if(!confirm('Excluir este registro? Esta ação não poderá ser desfeita.'))return;try{await api('/api/'+t+'/'+id,{method:'DELETE'});toast('Registro excluído');await load()}catch(e){toast(e.message)}}
function downloadCsv(t){location.href='/api/export?table='+t}
function printQuote(id){let r=data.quotes.find(q=>q.id===id);if(!r)return;let win=window.open('','_blank');if(!win){toast('Autorize pop-ups para imprimir');return}let items=r.items||[];win.document.write(`<html><head><title>Orçamento ${id}</title><meta charset="utf-8"><style>body{font:15px Arial;padding:45px;color:#222;max-width:800px;margin:auto}header{display:flex;align-items:center;border-bottom:3px solid #20134d;padding-bottom:20px;gap:20px}img{width:95px}h1{margin:0;color:#20134d}table{width:100%;border-collapse:collapse;margin:30px 0}td,th{border-bottom:1px solid #ccc;padding:12px;text-align:left}footer{margin-top:80px;border-top:1px solid #777;padding-top:10px}

 .mobile-dock button{background:transparent;border:0;color:#92aac0;font-size:10px;font-weight:700;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;border-radius:12px}
 .mobile-dock button .dockicon{font-size:23px;line-height:1.1}.mobile-dock button.active{color:#54d8f0;background:#1b3549}.mobile-dock button span:last-child{white-space:nowrap}
 .mobile-hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#1a3655,#172942 55%,#1b3051);border:1px solid #37536b;border-radius:20px;padding:20px 18px;margin-bottom:10px}.mobile-hero:after{content:'';position:absolute;width:130px;height:130px;right:-40px;top:-42px;border-radius:50%;background:#4ab9f014;box-shadow:0 0 35px #62c7ff1c}.mobile-hero h2{font-size:22px;line-height:1.25;max-width:280px;margin:8px 0}.mobile-hero p{font-size:12px;line-height:1.6}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:17px}.quick-grid button{min-height:82px;border:1px solid #31475e;border-radius:17px;background:#17273d;color:#eaf7ff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;font-size:11px;font-weight:750}.quick-grid button .quick-icon{font-size:24px}
 .login{align-items:center;padding:20px}.loginbox{padding:26px 20px;border-radius:26px}.loginbox .field{min-height:52px}.loginbox .btn{min-height:52px}
}
@media(min-width:741px){.mobile-dock,.quick-grid{display:none!important}.mobile-hero{background:radial-gradient(ellipse at 95% 5%,#224f7377,transparent 54%),linear-gradient(115deg,#1a2d43,#142238);border:1px solid #2d455c;border-radius:18px;padding:24px}}
</style></head><body><header><img src="${location.origin}/logo.jpg"><div><h1>FORTE GESSO</h1><p>Orçamento nº ${id}</p></div></header><h2>${esc(r.title)}</h2><p>Cliente: <b>${esc(person(r.client_id))}</b></p><p>Emissão: ${fmt(r.created_at)}</p><table><tr><th>Descrição</th><th>Qtd.</th><th>Unitário</th><th>Subtotal</th></tr>${items.map(i=>`<tr><td>${esc(i.description)}</td><td>${esc(i.qty)}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table><h2 style="text-align:right">Total: ${money(r.total)}</h2><footer>Forte Gesso • Proposta sujeita à confirmação</footer><script>window.onload=()=>window.print()<\/script></body></html>`);win.document.close()}
function changePassword(){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Alterar senha</h2><form id="passform"><div class="fields">${field('old','Senha atual','password')}${field('new','Nova senha (mínimo 8 caracteres)','password')}</div><div class="modalfoot"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn primary">Atualizar senha</button></div></form></div></div>`;$('#passform').onsubmit=async e=>{e.preventDefault();try{await api('/api/password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Senha atualizada')}catch(e){toast(e.message)}}}
startup().catch(e=>toast(e.message));
